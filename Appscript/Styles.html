<style>
  :root {
    --bg: #0c0f14;
    --bg-soft: #12161d;
    --surface: rgba(24, 28, 36, 0.86);
    --surface-strong: #1e2430;
    --surface-soft: #151a22;
    --line: rgba(255, 255, 255, 0.075);
    --line-strong: rgba(223, 255, 47, 0.28);
    --text: #f5f7f2;
    --muted: #a7acb8;
    --muted-2: #7c8391;
    --brand: #dfff2f;
    --brand-soft: rgba(211, 244, 49, 0.11);
    --brand-line: rgba(211, 244, 49, 0.28);
    --danger: #ff5c6c;
    --ok: #35d98c;
    --radius-xs: 8px;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 18px;
    --shadow-sm: 0 10px 26px rgba(0, 0, 0, 0.18);
    --shadow: 0 20px 70px rgba(0, 0, 0, 0.28);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Arial, Helvetica, sans-serif;
  }

  body {
    overflow-x: hidden;
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .app-shell {
    position: relative;
    display: grid;
    grid-template-columns: 244px minmax(0, 1fr);
    min-height: 100vh;
    background:
      radial-gradient(circle at 18% 0%, rgba(171, 255, 58, 0.105), transparent 26rem),
      radial-gradient(circle at 78% 8%, rgba(44, 218, 166, 0.105), transparent 30rem),
      radial-gradient(circle at 50% 100%, rgba(105, 113, 135, 0.13), transparent 34rem),
      linear-gradient(180deg, #11151c 0%, #0b0e13 100%);
  }

  .app-shell.sidebar-collapsed {
    grid-template-columns: 88px minmax(0, 1fr);
  }

  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 22px;
    padding: 22px 16px;
    border-right: 1px solid var(--line);
    background: rgba(18, 20, 25, 0.84);
    backdrop-filter: blur(18px);
    z-index: 8;
  }

  .brand-block {
    display: flex;
    align-items: center;
    min-height: 54px;
    padding: 0 8px;
  }

  .brand-copy strong {
    display: block;
    font-size: 20px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0;
  }

  .brand-copy span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
  }

  .sidebar.collapsed .brand-copy span,
  .sidebar.collapsed .nav-item span {
    display: none;
  }

  .sidebar.collapsed .brand-block {
    justify-content: center;
    padding: 0;
  }

  .sidebar.collapsed .brand-copy strong {
    font-size: 15px;
  }

  .main-nav {
    display: grid;
    gap: 8px;
  }

  .nav-item {
    min-height: 44px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    text-align: left;
    padding: 0 14px;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }

  .nav-item.active {
    background: rgba(223, 255, 47, 0.12);
    border-color: var(--brand-line);
    color: var(--text);
    font-weight: 800;
  }

  .nav-item.muted {
    color: #6e7480;
  }

  .collapse-btn,
  .icon-btn {
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.045);
    color: var(--text);
  }

  .collapse-btn {
    margin-top: auto;
    width: 44px;
    height: 40px;
    display: grid;
    place-items: center;
    gap: 4px;
    padding: 10px;
  }

  .collapse-btn span {
    display: block;
    width: 17px;
    height: 2px;
    border-radius: 99px;
    background: currentColor;
  }

  .workspace {
    min-width: 0;
    padding: 28px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--brand);
    font-size: 12px;
    font-weight: 850;
    text-transform: uppercase;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  h1 {
    margin-bottom: 0;
    font-size: 40px;
    line-height: 1.05;
    letter-spacing: 0;
  }

  h2 {
    margin-bottom: 4px;
    font-size: 24px;
  }

  h3 {
    margin-bottom: 10px;
    font-size: 18px;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sync-state {
    min-width: 104px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.035);
    color: var(--muted);
    text-align: center;
    font-size: 13px;
  }

  .filters-band {
    display: grid;
    grid-template-columns: minmax(180px, 280px) minmax(240px, 1fr) minmax(240px, 1fr);
    gap: 14px;
    align-items: start;
    padding: 12px 14px;
    border: 1px solid rgba(255, 255, 255, 0.065);
    border-radius: 14px;
    background: rgba(24, 28, 36, 0.68);
    box-shadow: none;
    margin-bottom: 16px;
  }

  label {
    display: grid;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 780;
    text-transform: uppercase;
  }

  input,
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: rgba(10, 12, 16, 0.72);
    color: var(--text);
    padding: 12px;
    outline: none;
  }

  textarea {
    resize: vertical;
    min-height: 84px;
    text-transform: none;
  }

  input:focus,
  textarea:focus {
    border-color: var(--brand-line);
    box-shadow: 0 0 0 3px rgba(223, 255, 47, 0.09);
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    min-height: 30px;
    border: 1px solid rgba(255, 255, 255, 0.095);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.035);
    color: #dfe4ee;
    padding: 0 11px;
    transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
  }

  .chip.active,
  .primary-btn {
    border-color: rgba(211, 244, 49, 0.42);
    background: rgba(211, 244, 49, 0.14);
    color: var(--brand);
    font-weight: 850;
  }

  .chip:hover,
  .ghost-btn:hover,
  .small-btn:hover,
  .subtab:hover {
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.075);
  }

  .subtabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .subtab {
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.035);
    color: var(--muted);
    padding: 0 16px;
    white-space: nowrap;
    font-weight: 760;
    letter-spacing: 0;
  }

  .subtab.active {
    color: #171a20;
    background: var(--brand);
    border-color: var(--brand);
  }

  .view {
    min-height: 360px;
  }

  .grid-kpis {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }

  .kpi,
  .panel,
  .teacher-card,
  .student-row,
  .agenda-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .kpi {
    padding: 16px;
  }

  .kpi span {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    font-weight: 760;
  }

  .kpi-value {
    margin-top: 8px;
    color: var(--brand);
    font-size: 34px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0;
  }

  .panel {
    padding: 16px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: baseline;
    margin-bottom: 12px;
  }

  .panel-head p {
    color: var(--muted);
    margin-bottom: 0;
  }

  .heat-table,
  .professor-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width: 720px;
    overflow: hidden;
  }

  .heat-table th,
  .heat-table td,
  .professor-table th,
  .professor-table td {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 10px;
    text-align: center;
  }

  .heat-table th:first-child,
  .heat-table td:first-child,
  .professor-table th:first-child,
  .professor-table td:first-child {
    border-left: 1px solid var(--line);
  }

  .heat-table thead th,
  .professor-table thead th {
    border-top: 1px solid var(--line);
  }

  .heat-table th,
  .professor-table th {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.035);
  }

  .time-head {
    color: var(--brand);
    font-weight: 850;
    white-space: nowrap;
  }

  .heat-cell {
    color: var(--text);
    font-weight: 850;
    background: rgba(223, 255, 47, calc(var(--heat-alpha, 0.08) * 0.44));
  }

  .heat-cell.empty {
    color: var(--muted-2);
    background: rgba(255, 255, 255, 0.025);
  }

  .turn-grid,
  .teacher-grid,
  .agenda-grid {
    display: grid;
    gap: 14px;
  }

  .turn-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .turn-card {
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface-soft);
  }

  .bar-track {
    height: 9px;
    background: rgba(255, 255, 255, 0.08);
    margin-top: 10px;
    border-radius: 999px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--brand);
    width: var(--bar-width, 0%);
  }

  .agenda-grid {
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }

  .agenda-day {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    min-width: 0;
    overflow: hidden;
  }

  .agenda-day h3 {
    margin: 0;
    padding: 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(223, 255, 47, 0.11);
    color: var(--text);
  }

  .agenda-time {
    padding: 12px;
    border-bottom: 1px solid var(--line);
  }

  .agenda-time:last-child {
    border-bottom: 0;
  }

  .agenda-time-label {
    color: var(--brand);
    font-weight: 850;
    margin-bottom: 8px;
  }

  .agenda-card {
    padding: 10px;
    margin-top: 8px;
    background: rgba(255, 255, 255, 0.045);
    box-shadow: none;
  }

  .agenda-card strong,
  .student-name {
    display: block;
    color: var(--text);
  }

  .agenda-card span,
  .student-meta,
  .muted {
    color: var(--muted);
    font-size: 12px;
  }

  .teacher-grid {
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  }

  .teacher-card {
    padding: 16px;
  }

  .teacher-total {
    color: var(--brand);
    font-size: 38px;
    font-weight: 900;
  }

  .mini-stat {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) 34px;
    gap: 10px;
    align-items: center;
    margin-top: 9px;
    color: var(--muted);
    font-size: 12px;
  }

  .students-toolbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    color: var(--muted);
  }

  .student-list {
    display: grid;
    gap: 8px;
  }

  .student-row {
    display: grid;
    grid-template-columns: minmax(180px, 1.4fr) 110px minmax(220px, 2fr) 92px;
    gap: 12px;
    align-items: center;
    padding: 12px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    min-height: 28px;
    padding: 0 10px;
    border: 1px solid var(--brand-line);
    border-radius: 999px;
    background: var(--brand-soft);
    color: var(--brand);
    font-size: 12px;
    font-weight: 850;
  }

  .ghost-btn,
  .primary-btn,
  .small-btn {
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0 14px;
  }

  .ghost-btn,
  .small-btn {
    background: rgba(255, 255, 255, 0.045);
    color: var(--text);
  }

  .small-btn {
    min-height: 34px;
    font-size: 12px;
  }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 10, 0.64);
    backdrop-filter: blur(4px);
    z-index: 20;
  }

  .student-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: min(560px, 100vw);
    height: 100vh;
    overflow: auto;
    background: #181b22;
    border-left: 1px solid var(--line);
    box-shadow: var(--shadow);
    z-index: 21;
    padding: 22px;
  }

  .drawer-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .drawer-header span {
    color: var(--muted);
    font-size: 12px;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    font-size: 28px;
    line-height: 1;
  }

  .form-grid {
    display: grid;
    gap: 14px;
    margin-bottom: 18px;
  }

  .slot-editor {
    display: grid;
    gap: 10px;
  }

  .slot-row {
    display: grid;
    grid-template-columns: 42px 1fr 1fr 0.82fr;
    gap: 8px;
    align-items: end;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.035);
  }

  .slot-index {
    color: var(--brand);
    font-size: 18px;
    font-weight: 900;
    padding-bottom: 12px;
  }

  .drawer-actions {
    position: sticky;
    bottom: -22px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 0 0;
    background: #181b22;
    margin-top: 16px;
  }

  .toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    max-width: 360px;
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    background: var(--brand);
    color: #171a20;
    font-weight: 850;
    z-index: 40;
    box-shadow: var(--shadow);
  }

  .empty-state {
    padding: 40px 20px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
    text-align: center;
  }

  .table-scroll {
    overflow: auto;
    border-radius: var(--radius-sm);
  }

  [hidden] {
    display: none !important;
  }

  .heatmap-hero {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    margin-bottom: 18px;
  }

  .heat-period-panel,
  .heat-detail-panel,
  .agenda-standard-toolbar {
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: rgba(21, 25, 32, 0.76);
    box-shadow: var(--shadow-sm);
  }

  .heat-period-panel {
    padding: 18px;
    min-height: 310px;
    display: grid;
    align-content: start;
    gap: 16px;
  }

  .heat-period-head {
    display: flex;
    justify-content: center;
  }

  .heat-period-head h3 {
    margin: 0;
    color: var(--text);
    font-size: 15px;
    font-weight: 850;
    text-transform: uppercase;
  }

  .heat-mini-grid {
    justify-self: center;
    display: grid;
    grid-template-columns: 52px repeat(var(--mini-day-count, 5), 40px);
    gap: 5px;
    align-items: center;
  }

  .heat-mini-row {
    display: contents;
  }

  .heat-mini-day,
  .heat-mini-time {
    color: var(--muted);
    font-size: 11px;
    font-weight: 850;
    text-align: center;
    text-transform: uppercase;
  }

  .heat-mini-time {
    text-align: right;
    padding-right: 6px;
  }

  .heat-mini-cell {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 7px;
    color: #061015;
    font-weight: 900;
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.18);
  }

  .level-empty {
    background: rgba(255, 255, 255, 0.045) !important;
    color: transparent !important;
  }

  .level-cool {
    background: #1598a8 !important;
  }

  .level-low {
    background: #18a957 !important;
  }

  .level-medium {
    background: #b7a51d !important;
  }

  .level-high {
    background: #b86b23 !important;
  }

  .level-full {
    background: #b84a35 !important;
  }

  .level-over {
    background: #a8324a !important;
    color: #fff !important;
  }

  .heat-period-total {
    align-self: end;
    justify-self: end;
    color: var(--brand);
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .heat-detail-grid {
    display: grid;
    grid-template-columns: 92px repeat(var(--day-count), minmax(180px, 1fr));
    gap: 8px;
    min-width: 980px;
  }

  .heat-detail-corner,
  .heat-detail-day,
  .heat-detail-time {
    min-height: 44px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.045);
    color: var(--brand);
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .heat-detail-row {
    display: contents;
  }

  .heat-detail-cell {
    min-height: 96px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-content: center;
    gap: 9px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    padding: 14px;
    text-align: left;
  }

  .heat-detail-cell span {
    font-size: 16px;
    font-weight: 900;
  }

  .heat-detail-cell small {
    align-self: center;
    color: var(--muted);
    font-size: 10px;
    font-weight: 850;
    text-transform: uppercase;
  }

  .slot-modal-backdrop {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(4, 6, 9, 0.74);
    backdrop-filter: blur(5px);
    z-index: 60;
  }

  .slot-modal {
    width: min(430px, 100%);
    max-height: min(620px, calc(100vh - 36px));
    overflow: auto;
    border: 1px solid var(--brand-line);
    border-radius: var(--radius-lg);
    background: #171a21;
    box-shadow: 0 26px 90px rgba(0, 0, 0, 0.48);
    padding: 18px;
  }

  .slot-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }

  .slot-modal-head h3 {
    margin: 0;
    color: var(--brand);
    font-size: 15px;
    line-height: 1.35;
  }

  .slot-modal-list {
    display: grid;
    gap: 2px;
  }

  .slot-modal-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    font-weight: 750;
  }

  .slot-person-icon {
    color: #7755d8;
    margin-right: 10px;
  }

  .slot-teacher-badge {
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--brand);
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 850;
  }

  .agenda-standard-toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .agenda-standard-toolbar label {
    display: flex;
    grid-template-columns: none;
    align-items: center;
    gap: 10px;
    color: var(--text);
  }

  select {
    min-height: 38px;
    border: 1px solid var(--brand-line);
    border-radius: var(--radius-sm);
    background: #151922;
    color: var(--brand);
    padding: 0 34px 0 12px;
    outline: none;
    font: inherit;
    font-weight: 800;
  }

  .agenda-standard-total {
    margin-left: auto;
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
