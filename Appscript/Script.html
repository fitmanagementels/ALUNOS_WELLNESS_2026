<script>
  const state = {
    data: null,
    activeTab: "heatmap",
    selectedStatuses: [],
    selectedProfessors: [],
    query: "",
    editingStudentId: null,
    agendaDay: "",
    agendaProfessor: "",
    filtersCollapsed: false,
    loadedOnce: false,
  };

  const dayOrder = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];
  const tabLabels = {
    heatmap: "Mapa de Calor",
    agenda: "Agenda",
    teachers: "Professores",
    students: "Alunos",
  };

  function $(selector, root) {
    return (root || document).querySelector(selector);
  }

  function $all(selector, root) {
    return Array.from((root || document).querySelectorAll(selector));
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function normalizeKey(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();
  }

  function sortDays(a, b) {
    const diff = (dayOrder.indexOf(a) + 1 || 99) - (dayOrder.indexOf(b) + 1 || 99);
    return diff || a.localeCompare(b);
  }

  function timeToMinutes(time) {
    const match = String(time || "").match(/^(\d{2}):(\d{2})$/);
    return match ? Number(match[1]) * 60 + Number(match[2]) : 99999;
  }

  function groupBy(items, selector) {
    return items.reduce((groups, item) => {
      const key = selector(item);
      if (!groups[key]) groups[key] = [];
      groups[key].push(item);
      return groups;
    }, {});
  }

  function unique(items) {
    return Array.from(new Set(items.filter(Boolean)));
  }

  function serverCall(name, ...args) {
    return new Promise((resolve, reject) => {
      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) => reject(new Error(error && error.message ? error.message : error)))
          [name](...args);
        return;
      }

      if (name === "getAgendaAppData") {
        resolve(makeDemoData());
        return;
      }

      reject(new Error("Apps Script indisponível neste contexto."));
    });
  }

  function makeDemoData() {
    const students = [
      {
        id: "A1",
        name: "Ana Silva",
        daysCount: 2,
        status: "Ativo",
        isActive: true,
        observations: "Preferencia manhã",
        slots: [
          { index: 1, professor: "Prof A", day: "Segunda", time: "05:15" },
          { index: 2, professor: "Prof B", day: "Quarta", time: "15:30" },
          { index: 3, professor: "", day: "", time: "" },
          { index: 4, professor: "", day: "", time: "" },
          { index: 5, professor: "", day: "", time: "" },
          { index: 6, professor: "", day: "", time: "" },
        ],
      },
      {
        id: "B2",
        name: "Bruno Costa",
        daysCount: 1,
        status: "Pausado",
        isActive: false,
        observations: "",
        slots: [
          { index: 1, professor: "Prof A", day: "Segunda", time: "12:00" },
          { index: 2, professor: "", day: "", time: "" },
          { index: 3, professor: "", day: "", time: "" },
          { index: 4, professor: "", day: "", time: "" },
          { index: 5, professor: "", day: "", time: "" },
          { index: 6, professor: "", day: "", time: "" },
        ],
      },
    ];

    const lessons = students.flatMap((student) =>
      student.slots
        .filter((slot) => slot.professor && slot.day && slot.time)
        .map((slot) => ({
          id: `${student.id}-${slot.index}`,
          studentId: student.id,
          studentName: student.name,
          studentStatus: student.status,
          professor: slot.professor,
          day: slot.day,
          time: slot.time,
          turn: timeToMinutes(slot.time) < 720 ? "manha" : "tarde",
          slotIndex: slot.index,
        })),
    );

    return {
      students,
      lessons,
      statuses: ["Ativo", "Pausado"],
      professors: ["Prof A", "Prof B"],
      days: ["Segunda", "Quarta"],
      times: ["05:15", "12:00", "15:30"],
      analytics: { totals: { students: 2, activeStudents: 1, lessons: 3, professors: 2 } },
      brand: { name: "XSTEAM" },
    };
  }

  function setSync(text) {
    $("#syncState").textContent = text;
  }

  function showToast(message) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.hidden = false;
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => {
      toast.hidden = true;
    }, 2800);
  }


  function initializeFilters() {
    if (state.loadedOnce) return;
    const activeStatus = state.data.statuses.find((status) => normalizeKey(status) === "ativo");
    state.selectedStatuses = activeStatus ? [activeStatus] : [];
    state.loadedOnce = true;
  }

  function loadData() {
    setSync("Carregando");
    return serverCall("getAgendaAppData")
      .then((data) => {
        state.data = data;
        initializeFilters();
        hydrateDatalists();
        renderFilters();
        renderCurrentTab();
        setSync("Atualizado");
      })
      .catch((error) => {
        setSync("Erro");
        renderError(error.message || String(error));
      });
  }

  function hydrateDatalists() {
    const writeOptions = (selector, values) => {
      $(selector).innerHTML = values.map((value) => `<option value="${escapeHtml(value)}"></option>`).join("");
    };

    writeOptions("#statusList", state.data.statuses);
    writeOptions("#professorList", state.data.professors);
    writeOptions("#dayList", state.data.days.length ? state.data.days : dayOrder);
    writeOptions("#timeList", state.data.times);
  }


  function updateFilterPanelState() {
    const band = $("#filtersBand");
    const toggle = $("#filterToggle");
    const summary = $("#filtersSummary");
    if (!band || !toggle || !summary) return;

    const statusLabel = state.selectedStatuses.length ? state.selectedStatuses.join(", ") : "Todos status";
    const professorLabel = state.selectedProfessors.length ? state.selectedProfessors.join(", ") : "Todos professores";
    const searchLabel = state.query ? `Busca: ${state.query}` : "Sem busca";

    summary.textContent = `${statusLabel} · ${professorLabel} · ${searchLabel}`;
    band.classList.toggle("collapsed", state.filtersCollapsed);
    toggle.textContent = state.filtersCollapsed ? "Mostrar" : "Ocultar";
    toggle.setAttribute("aria-expanded", String(!state.filtersCollapsed));
  }
  function renderFilters() {
    const statusChips = state.data.statuses.map((status) => {
      const active = state.selectedStatuses.some((item) => normalizeKey(item) === normalizeKey(status));
      return `<button class="chip ${active ? "active" : ""}" type="button" data-status="${escapeHtml(status)}">${escapeHtml(status)}</button>`;
    });

    $("#statusChips").innerHTML = statusChips.join("") || `<span class="muted">Sem status</span>`;

    const professorChips = [
      `<button class="chip ${state.selectedProfessors.length ? "" : "active"}" type="button" data-professor="__all">Todos</button>`,
    ].concat(
      state.data.professors.map((professor) => {
        const active = state.selectedProfessors.includes(professor);
        return `<button class="chip ${active ? "active" : ""}" type="button" data-professor="${escapeHtml(professor)}">${escapeHtml(professor)}</button>`;
      }),
    );

    $("#professorChips").innerHTML = professorChips.join("");
    updateFilterPanelState();
  }

  function getFilteredData() {
    if (!state.data) return { students: [], lessons: [] };

    const selectedStatusKeys = state.selectedStatuses.map(normalizeKey);
    const query = normalizeKey(state.query);

    const students = state.data.students.filter((student) => {
      const statusOk = !selectedStatusKeys.length || selectedStatusKeys.includes(normalizeKey(student.status));
      const queryOk = !query || normalizeKey(`${student.name} ${student.id}`).includes(query);
      const professorOk =
        !state.selectedProfessors.length ||
        student.slots.some((slot) => state.selectedProfessors.includes(slot.professor));
      return statusOk && queryOk && professorOk;
    });

    const ids = new Set(students.map((student) => student.id));
    const lessons = state.data.lessons.filter((lesson) => {
      const studentOk = ids.has(lesson.studentId);
      const professorOk = !state.selectedProfessors.length || state.selectedProfessors.includes(lesson.professor);
      return studentOk && professorOk;
    });

    return { students, lessons };
  }

  function renderCurrentTab() {
    if (!state.data) return;
    $all(".subtab").forEach((button) => button.classList.toggle("active", button.dataset.tab === state.activeTab));

    const renderers = {
      heatmap: renderHeatmap,
      agenda: renderAgenda,
      teachers: renderTeachers,
      students: renderStudents,
    };

    renderers[state.activeTab]();
  }

  function renderError(message) {
    $("#viewRoot").innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
  }

  function renderKpis(filtered) {
    const occupiedSlots = unique(filtered.lessons.map((lesson) => `${lesson.day}|${lesson.time}`)).length;
    const peak = Object.entries(groupBy(filtered.lessons, (lesson) => `${lesson.day} ${lesson.time}`))
      .sort((a, b) => b[1].length - a[1].length)[0];

    return `
      <div class="grid-kpis">
        <div class="kpi"><span>Alunos filtrados</span><div class="kpi-value">${filtered.students.length}</div></div>
        <div class="kpi"><span>Aulas semanais</span><div class="kpi-value">${filtered.lessons.length}</div></div>
        <div class="kpi"><span>Professores</span><div class="kpi-value">${unique(filtered.lessons.map((lesson) => lesson.professor)).length}</div></div>
        <div class="kpi"><span>Pico</span><div class="kpi-value">${peak ? peak[1].length : 0}</div><span>${peak ? escapeHtml(peak[0]) : "Sem aulas"}</span></div>
      </div>`;
  }

  function getHeatmapCapacity() {
    return 10;
  }

  function getHeatmapLevel(count, capacity) {
    const safeCapacity = Math.max(1, Number(capacity) || getHeatmapCapacity());
    const ratio = count / safeCapacity;
    if (!count) return "empty";
    if (ratio > 1) return "over";
    if (ratio >= 0.9) return "full";
    if (ratio >= 0.7) return "high";
    if (ratio >= 0.5) return "medium";
    if (ratio >= 0.3) return "low";
    return "cool";
  }

  function getPeriodForHeatmap(time) {
    const minutes = timeToMinutes(time);
    if (minutes >= 315 && minutes < 735) return "morning";
    if (minutes >= 735 && minutes <= 1275) return "afternoon";
    return "outside";
  }

  function buildSlotSummary(lessons, day, time) {
    const slotLessons = lessons.filter((lesson) => lesson.day === day && lesson.time === time);
    return {
      day,
      time,
      lessons: slotLessons,
      studentCount: unique(slotLessons.map((lesson) => lesson.studentId)).length,
      professorCount: unique(slotLessons.map((lesson) => lesson.professor)).length,
    };
  }

  function renderMiniHeatmapPanel(title, icon, times, days, lessons) {
    const capacity = getHeatmapCapacity();
    const total = times.reduce((sum, time) => {
      return sum + days.reduce((daySum, day) => daySum + buildSlotSummary(lessons, day, time).studentCount, 0);
    }, 0);

    const rows = times.map((time) => {
      const cells = days.map((day) => {
        const summary = buildSlotSummary(lessons, day, time);
        const level = getHeatmapLevel(summary.studentCount, capacity);
        return `<button class="heat-mini-cell level-${level}" type="button" data-heat-slot="${escapeHtml(day)}|${escapeHtml(time)}" aria-label="${escapeHtml(day)} ${escapeHtml(time)} ${summary.studentCount} alunos">${summary.studentCount || ""}</button>`;
      });
      return `<div class="heat-mini-row"><div class="heat-mini-time">${escapeHtml(time)}</div>${cells.join("")}</div>`;
    });

    return `
      <section class="heat-period-panel">
        <div class="heat-period-head"><h3>${icon} ${escapeHtml(title)}</h3></div>
        <div class="heat-mini-grid" style="--mini-day-count:${days.length}">
          <div></div>
          ${days.map((day) => `<div class="heat-mini-day">${escapeHtml(day.slice(0, 3).toUpperCase())}</div>`).join("")}
          ${rows.join("")}
        </div>
        <div class="heat-period-total">▣ ${total} aulas na semana</div>
      </section>`;
  }

  function renderHeatmap() {
    const filtered = getFilteredData();
    const days = (state.data.days.length ? state.data.days : dayOrder).slice().sort(sortDays);
    const times = state.data.times.slice().sort((a, b) => timeToMinutes(a) - timeToMinutes(b));
    const morningTimes = times.filter((time) => getPeriodForHeatmap(time) === "morning");
    const afternoonTimes = times.filter((time) => getPeriodForHeatmap(time) === "afternoon");
    $("#viewRoot").innerHTML = `
      ${renderKpis(filtered)}
      <div class="heatmap-hero heatmap-hero-only">
        ${renderMiniHeatmapPanel("MANHÃ (05:15 - 12:15)", "☀️", morningTimes, days, filtered.lessons)}
        ${renderMiniHeatmapPanel("TARDE / NOITE (12:15 - 21:15)", "🌙", afternoonTimes, days, filtered.lessons)}
      </div>`;
  }

  function openHeatSlotModal(day, time) {
    const filtered = getFilteredData();
    const lessons = filtered.lessons
      .filter((lesson) => lesson.day === day && lesson.time === time)
      .sort((a, b) => a.studentName.localeCompare(b.studentName));
    const capacity = getHeatmapCapacity();
    const studentCount = unique(lessons.map((lesson) => lesson.studentId)).length;

    const rows = lessons.map((lesson) => `
      <div class="slot-modal-row">
        <div><span class="slot-person-icon">●</span>${escapeHtml(lesson.studentName)}</div>
        <span class="slot-teacher-badge">${escapeHtml(lesson.professor)}</span>
      </div>`).join("");

    const modal = document.createElement("div");
    modal.className = "slot-modal-backdrop";
    modal.id = "slotModal";
    modal.innerHTML = `
      <section class="slot-modal" role="dialog" aria-modal="true" aria-label="Detalhes do horário">
        <div class="slot-modal-head">
          <h3>▣ ${escapeHtml(day)} · ◷ ${escapeHtml(time)} (${studentCount}/${capacity} alunos)</h3>
          <button class="icon-btn" type="button" data-close-slot-modal aria-label="Fechar">×</button>
        </div>
        <div class="slot-modal-list">${rows || `<div class="empty-state">Sem alunos neste horário</div>`}</div>
      </section>`;
    document.body.appendChild(modal);
  }

  function closeHeatSlotModal() {
    const modal = $("#slotModal");
    if (modal) modal.remove();
  }
  function renderProfessorDayMatrix(lessons, days) {
    const professors = unique(lessons.map((lesson) => lesson.professor)).sort((a, b) => a.localeCompare(b));
    const groups = groupBy(lessons, (lesson) => `${lesson.professor}|${lesson.day}`);

    const rows = professors.map((professor) => {
      const cells = days.map((day) => `<td>${(groups[`${professor}|${day}`] || []).length}</td>`);
      return `<tr><th>${escapeHtml(professor)}</th>${cells.join("")}</tr>`;
    });

    return `
      <div class="panel">
        <div class="panel-head"><h3>Aulas por professor e dia</h3><p>${professors.length} professores</p></div>
        <div class="table-scroll">
          <table class="professor-table">
            <thead><tr><th>Professor</th>${days.map((day) => `<th>${escapeHtml(day)}</th>`).join("")}</tr></thead>
            <tbody>${rows.join("") || `<tr><td colspan="${days.length + 1}">Sem professores</td></tr>`}</tbody>
          </table>
        </div>
      </div>`;
  }

  function ensureAgendaDefaults(days) {
    if (!state.agendaDay && days.length) state.agendaDay = days[0];
    if (state.agendaDay && !days.includes(state.agendaDay) && days.length) state.agendaDay = days[0];
    if (state.agendaProfessor && !state.data.professors.includes(state.agendaProfessor)) state.agendaProfessor = "";
  }

  function renderAgenda() {
    const filtered = getFilteredData();
    const days = (state.data.days.length ? state.data.days : dayOrder).slice().sort(sortDays);
    const professors = state.data.professors.slice().sort((a, b) => a.localeCompare(b));
    ensureAgendaDefaults(days);

    const selectedDay = state.agendaDay || days[0] || "";
    const selectedProfessor = state.agendaProfessor || "";
    const dayLessons = filtered.lessons
      .filter((lesson) => !selectedDay || lesson.day === selectedDay)
      .filter((lesson) => !selectedProfessor || lesson.professor === selectedProfessor)
      .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time) || a.studentName.localeCompare(b.studentName));
    const byTime = groupBy(dayLessons, (lesson) => lesson.time);
    const times = unique(dayLessons.map((lesson) => lesson.time)).sort((a, b) => timeToMinutes(a) - timeToMinutes(b));

    const blocks = times.map((time) => {
      const lessons = byTime[time] || [];
      const studentCount = unique(lessons.map((lesson) => lesson.studentId)).length;
      const cards = lessons.map((lesson) => `
        <article class="standard-agenda-card">
          <strong>${escapeHtml(lesson.studentName)}</strong>
          <span>Prof: ${escapeHtml(lesson.professor)}</span>
        </article>`).join("");

      return `
        <section class="standard-agenda-time">
          <div class="standard-agenda-time-head">
            <h3>${escapeHtml(time)}</h3>
            <span>● ${studentCount} alunos</span>
            <span>▣ ${lessons.length} aula(s)</span>
          </div>
          <div class="standard-agenda-cards">${cards}</div>
        </section>`;
    }).join("");

    $("#viewRoot").innerHTML = `
      <div class="agenda-standard-toolbar">
        <label>Dia
          <select id="agendaDayFilter">
            ${days.map((day) => `<option value="${escapeHtml(day)}" ${day === selectedDay ? "selected" : ""}>${escapeHtml(day)}</option>`).join("")}
          </select>
        </label>
        <label>Professor
          <select id="agendaProfessorFilter">
            <option value="">Todos</option>
            ${professors.map((professor) => `<option value="${escapeHtml(professor)}" ${professor === selectedProfessor ? "selected" : ""}>${escapeHtml(professor)}</option>`).join("")}
          </select>
        </label>
        <div class="agenda-standard-total">▣ ${dayLessons.length} aula(s)</div>
      </div>
      <div class="standard-agenda-list">${blocks || `<div class="empty-state">Sem aulas para esse filtro</div>`}</div>`;
  }
  function renderTeachers() {
    const filtered = getFilteredData();
    const professors = unique(filtered.lessons.map((lesson) => lesson.professor)).sort((a, b) => a.localeCompare(b));
    const byProfessor = groupBy(filtered.lessons, (lesson) => lesson.professor);
    const maxDailyLessons = 15;

    const cards = professors.map((professor) => {
      const lessons = byProfessor[professor];
      const byDay = groupBy(lessons, (lesson) => lesson.day);
      const byTurn = groupBy(lessons, (lesson) => lesson.turn);
      const uniqueStudents = unique(lessons.map((lesson) => lesson.studentId)).length;
      const dayStats = (state.data.days.length ? state.data.days : dayOrder)
        .slice()
        .sort(sortDays)
        .map((day) => {
          const count = (byDay[day] || []).length;
          return `<div class="mini-stat"><span>${escapeHtml(day)}</span><div class="bar-track"><div class="bar-fill" style="--bar-width:${Math.min(100, (count / maxDailyLessons) * 100)}%"></div></div><strong>${count}</strong></div>`;
        })
        .join("");

      return `
        <article class="teacher-card">
          <h3>${escapeHtml(professor)}</h3>
          <div class="teacher-total">${lessons.length}</div>
          <p class="muted">${uniqueStudents} alunos · manhã ${(byTurn.manha || []).length} · tarde ${(byTurn.tarde || []).length}</p>
          ${dayStats}
        </article>`;
    });

    $("#viewRoot").innerHTML = `
      ${renderKpis(filtered)}
      <div class="teacher-grid">${cards.join("") || `<div class="empty-state">Sem professores no filtro atual</div>`}</div>`;
  }

  function renderStudents() {
    const filtered = getFilteredData();
    const rows = filtered.students
      .slice()
      .sort((a, b) => a.name.localeCompare(b.name))
      .map((student) => {
        const slots = student.slots.filter((slot) => slot.professor || slot.day || slot.time);
        const summary = slots.length
          ? slots.map((slot) => `${slot.professor || "-"} · ${slot.day || "-"} · ${slot.time || "-"}`).join("<br>")
          : "Sem horários";

        return `
          <article class="student-row">
            <div><strong class="student-name">${escapeHtml(student.name)}</strong><span class="student-meta">${escapeHtml(student.daysCount || 0)}x/sem.</span></div>
            <div><span class="status-pill">${escapeHtml(student.status)}</span></div>
            <div class="muted">${summary}</div>
            <button class="small-btn" type="button" data-edit-student="${escapeHtml(student.id)}">Editar</button>
          </article>`;
      });

    $("#viewRoot").innerHTML = `
      <div class="students-toolbar"><span>${filtered.students.length} alunos</span><span>${filtered.lessons.length} aulas semanais</span></div>
      <div class="student-list">${rows.join("") || `<div class="empty-state">Nenhum aluno encontrado</div>`}</div>`;
  }

  function openStudentDrawer(studentId) {
    const student = state.data.students.find((item) => item.id === studentId);
    if (!student) return;

    state.editingStudentId = student.id;
    $("#drawerStudentName").textContent = student.name || "Aluno";
    $("#drawerStudentId").textContent = student.id;
    $("#statusInput").value = student.status || "";
    $("#observationsInput").value = student.observations || "";

    $("#slotEditor").innerHTML = Array.from({ length: 6 }, (_, index) => {
      const slot = student.slots[index] || { professor: "", day: "", time: "" };
      return `
        <div class="slot-row" data-slot-row>
          <div class="slot-index">${index + 1}</div>
          <label>Professor<input data-slot-professor list="professorList" value="${escapeHtml(slot.professor)}"></label>
          <label>Dia<input data-slot-day list="dayList" value="${escapeHtml(slot.day)}"></label>
          <label>Hora<input data-slot-time list="timeList" value="${escapeHtml(slot.time)}" placeholder="HH:MM"></label>
        </div>`;
    }).join("");

    $("#drawerBackdrop").hidden = false;
    $("#studentDrawer").hidden = false;
  }

  function closeStudentDrawer() {
    state.editingStudentId = null;
    $("#drawerBackdrop").hidden = true;
    $("#studentDrawer").hidden = true;
  }

  function collectStudentPayload() {
    return {
      id: state.editingStudentId,
      status: $("#statusInput").value,
      observations: $("#observationsInput").value,
      slots: $all("[data-slot-row]").map((row) => ({
        professor: $("[data-slot-professor]", row).value,
        day: $("[data-slot-day]", row).value,
        time: $("[data-slot-time]", row).value,
      })),
    };
  }

  function saveStudent(event) {
    event.preventDefault();
    const button = $("#saveStudent");
    const payload = collectStudentPayload();
    button.disabled = true;
    button.textContent = "Salvando";
    setSync("Salvando");

    serverCall("saveAgendaStudent", payload)
      .then((data) => {
        state.data = data;
        hydrateDatalists();
        renderFilters();
        renderCurrentTab();
        closeStudentDrawer();
        setSync("Atualizado");
        showToast("Aluno atualizado");
      })
      .catch((error) => {
        setSync("Erro");
        showToast(error.message || String(error));
      })
      .finally(() => {
        button.disabled = false;
        button.textContent = "Salvar";
      });
  }

  function bindEvents() {
    $("#collapseSidebar").addEventListener("click", () => {
      $("#sidebar").classList.toggle("collapsed");
      $("#appShell").classList.toggle("sidebar-collapsed");
    });
    $("#refreshBtn").addEventListener("click", loadData);
    $("#filterToggle").addEventListener("click", () => {
      state.filtersCollapsed = !state.filtersCollapsed;
      updateFilterPanelState();
    });
    $("#searchInput").addEventListener("input", (event) => {
      state.query = event.target.value;
      updateFilterPanelState();
      renderCurrentTab();
    });

    $("#statusChips").addEventListener("click", (event) => {
      const button = event.target.closest("[data-status]");
      if (!button) return;
      const status = button.dataset.status;
      const exists = state.selectedStatuses.some((item) => normalizeKey(item) === normalizeKey(status));
      state.selectedStatuses = exists
        ? state.selectedStatuses.filter((item) => normalizeKey(item) !== normalizeKey(status))
        : state.selectedStatuses.concat(status);
      renderFilters();
      renderCurrentTab();
    });

    $("#professorChips").addEventListener("click", (event) => {
      const button = event.target.closest("[data-professor]");
      if (!button) return;
      const professor = button.dataset.professor;
      if (professor === "__all") {
        state.selectedProfessors = [];
      } else if (state.selectedProfessors.includes(professor)) {
        state.selectedProfessors = state.selectedProfessors.filter((item) => item !== professor);
      } else {
        state.selectedProfessors = state.selectedProfessors.concat(professor);
      }
      renderFilters();
      renderCurrentTab();
    });

    $all(".subtab").forEach((button) => {
      button.addEventListener("click", () => {
        state.activeTab = button.dataset.tab;
        renderCurrentTab();
      });
    });

    $("#viewRoot").addEventListener("click", (event) => {
      const heatButton = event.target.closest("[data-heat-slot]");
      if (heatButton) {
        const [day, time] = heatButton.dataset.heatSlot.split("|");
        openHeatSlotModal(day, time);
        return;
      }

      const editButton = event.target.closest("[data-edit-student]");
      if (!editButton) return;
      openStudentDrawer(editButton.dataset.editStudent);
    });

    $("#viewRoot").addEventListener("change", (event) => {
      if (event.target.id === "agendaDayFilter") {
        state.agendaDay = event.target.value;
        renderAgenda();
      }

      if (event.target.id === "agendaProfessorFilter") {
        state.agendaProfessor = event.target.value;
        renderAgenda();
      }
    });

    document.addEventListener("click", (event) => {
      if (event.target.matches("[data-close-slot-modal]") || event.target.id === "slotModal") {
        closeHeatSlotModal();
      }
    });

    $("#closeDrawer").addEventListener("click", closeStudentDrawer);
    $("#cancelEdit").addEventListener("click", closeStudentDrawer);
    $("#drawerBackdrop").addEventListener("click", closeStudentDrawer);
    $("#studentForm").addEventListener("submit", saveStudent);
  }

  document.addEventListener("DOMContentLoaded", () => {
    bindEvents();
    loadData();
  });
</script>
