name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: [apps-script/**, .github/workflows/deploy-apps-script.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração do deploy
        id: config
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_SECRET: ${{ secrets.APPS_SCRIPT_SHARED_SECRET }}
        run: |
          if [ -n "$CLASPRC_JSON" ] && [ -n "$APPS_SCRIPT_ID" ] && [ -n "$APPS_SCRIPT_API_DEPLOYMENT_ID" ] && [ -n "$APPS_SCRIPT_WEBAPP_URL" ] && [ -n "$APPS_SCRIPT_SHARED_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Deploy do Apps Script não configurado. Cadastre CLASPRC_JSON, APPS_SCRIPT_ID, APPS_SCRIPT_API_DEPLOYMENT_ID, APPS_SCRIPT_WEBAPP_URL e APPS_SCRIPT_SHARED_SECRET antes de publicar."
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - run: npm test
        if: steps.config.outputs.ready == 'true'
      - run: npm install --global @google/clasp@2.5.0
        if: steps.config.outputs.ready == 'true'
      - name: Publicar versão no Web App existente
        if: steps.config.outputs.ready == 'true'
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"apps-script"}\n' "$APPS_SCRIPT_ID" > .clasp.json
          clasp push --force
          clasp deploy --deploymentId "$APPS_SCRIPT_API_DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA}"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
      - name: Verificar API pública
        if: steps.config.outputs.ready == 'true'
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          APPS_SCRIPT_SHARED_SECRET: ${{ secrets.APPS_SCRIPT_SHARED_SECRET }}
        run: |
          node <<'NODE'
          (async function () {
            const url = String(process.env.APPS_SCRIPT_WEBAPP_URL || '');
            const sharedSecret = String(process.env.APPS_SCRIPT_SHARED_SECRET || '');
            if (!url.endsWith('/exec') || !sharedSecret) {
              throw new Error('Secrets do Web App ausentes ou inválidos.');
            }
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'content-type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ sharedSecret, action: 'versao', payload: {} }),
              redirect: 'follow'
            });
            const contentType = response.headers.get('content-type') || '';
            if (!response.ok || !contentType.includes('application/json')) {
              throw new Error(`Web App indisponível (HTTP ${response.status}, ${contentType || 'sem content-type'}).`);
            }
            const result = await response.json();
            if (!result || result.ok !== true || !result.data || !result.data.versao ||
                !result.data.capacidades || result.data.capacidades.perfilAluno !== true) {
              throw new Error('Web App respondeu sem uma versão compatível com perfis de alunos.');
            }
            console.log('Apps Script Web App saudável.');
          }()).catch(function (error) {
            console.error(error.message);
            process.exit(1);
          });
          NODE
